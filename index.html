<title>Amo Vocês ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #07111f, #102d4f, #06101d);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .container {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 700px;
        padding: 50px 30px;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        animation: aparecer 1.5s ease;
    }

    .coracao-principal {
        font-size: 70px;
        margin-bottom: 20px;
        animation: pulsar 1.5s infinite;
    }

    h1 {
        font-size: clamp(45px, 10vw, 90px);
        letter-spacing: 4px;
        margin-bottom: 20px;
        text-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
    }

    .mensagem {
        font-size: clamp(18px, 4vw, 25px);
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
    }

    .assinatura {
        margin-top: 30px;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.7);
    }

    .coracao {
        position: absolute;
        bottom: -50px;
        font-size: 25px;
        animation: subir linear forwards;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes aparecer {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes pulsar {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.18);
        }
    }

    @keyframes subir {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }

        10% {
            opacity: 0.8;
        }

        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        .container {
            padding: 40px 20px;
            border-radius: 24px;
        }

        .coracao-principal {
            font-size: 55px;
        }

        h1 {
            letter-spacing: 2px;
        }
    }
</style>
